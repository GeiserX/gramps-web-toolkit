[project]
name = "gwt-fetch"
version = "0.1.0"
description = "Pull archive images and text (IIIF, DIGIBIB, Gaceta de Madrid, Europeana) without a browser"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gwt-fetch = "gwt_fetch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gwt_fetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
