# Portuguese. Every locale file has the same sections; see docs/rules.md.
code = "pt"
name = "Portuguese"

[fold]
pairs = []
particles = ["de", "da", "do", "das", "dos", "e"]

[months]
"1" = ["janeiro", "jan"]
"2" = ["fevereiro", "fev"]
"3" = ["março", "mar"]
"4" = ["abril", "abr"]
"5" = ["maio", "mai"]
"6" = ["junho", "jun"]
"7" = ["julho", "jul"]
"8" = ["agosto", "ago"]
"9" = ["setembro", "set", "7bro"]
"10" = ["outubro", "out", "8bro"]
"11" = ["novembro", "nov", "9bro"]
"12" = ["dezembro", "dez", "xbro"]

[dates]
filler = ["de", "do", "dia", "ano", "aos"]

[roles]
godparent = ["padrinho", "madrinha", "padrinhos"]
witness = ["testemunha", "testemunhas"]
father = ["pai"]
mother = ["mãe"]
child = ["filho", "filha", "filhos"]
spouse = ["marido", "esposa", "esposo", "mulher", "viúvo", "viúva"]
priest = ["pároco", "padre", "vigário", "cura", "presbítero"]

[events]
birth = ["nascimento", "nasceu", "nascido", "nascida"]
baptism = ["batismo", "baptismo", "batizado", "baptizado", "baptizei"]
marriage = ["casamento", "matrimónio", "matrimônio", "casaram", "recebimento"]
death = ["óbito", "falecimento", "morte", "faleceu"]
burial = ["sepultura", "enterro", "sepultado", "sepultada"]

[dedication]
pairs = [
  ["N.ª S.ª", "Nossa Senhora"],
  ["N. Sra.", "Nossa Senhora"],
  ["Sto.", "Santo"],
  ["Sta.", "Santa"],
  ["S.", "São"],
]
