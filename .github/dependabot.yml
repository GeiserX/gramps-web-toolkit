version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["ci", "automated"]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 3
  - package-ecosystem: pip
    directories: ["/apply", "/fetch"]
    schedule:
      interval: weekly
    labels: ["dependencies", "automated"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /poller
    schedule:
      interval: weekly
    labels: ["dependencies", "automated"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
