name: Docs

# From new-repo/templates/docs-pages.yml, with the Build step's check for links
# to excluded files that unsent added.
#
# Pull requests run the strict build, so a broken link, a missing page or an
# unreachable page fails the check instead of reaching the site. A push to main
# deploys, and only after the same build has passed. The site is published as a
# Pages artifact, never with `mkdocs gh-deploy`: no gh-pages branch and no
# `contents: write`.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # Add every file a page includes with pymdownx.snippets (for example
      # docker-compose.yml, .env.example): a change to it must rebuild the
      # site, and a rename must fail the build.
  # No paths filter on pull requests, on purpose: a check skipped by a path
  # filter stays Pending and blocks the merge once it is a required check
  # (repos.md step 5 makes green checks required). The build takes seconds.
  pull_request:
  workflow_dispatch:

# One run at a time per ref, in push order, never cancelled. Locking only the
# deploy job is not enough: an older push whose build finishes later would
# deploy last and publish a stale site. Pull requests get their own group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    # Public repo: GitHub-hosted runners are free and unlimited here, and the
    # job runs on pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and every MkDocs plugin.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      # mkdocs.yml sets `strict: true`; the flag here keeps the build strict
      # even if someone removes that line. A link to an excluded note
      # (a capitalised .md, research/) is logged as INFO, which --strict
      # ignores and the validation block cannot promote, yet it 404s on the
      # site, so the log is searched for it. `shell: bash` runs with pipefail,
      # so a failed build still fails the step through the pipe.
      - name: Build
        shell: bash
        run: |
          mkdocs build --strict 2>&1 | tee build.log
          if grep 'which is excluded from the built site' build.log; then
            echo "::error::a page links to a file excluded from the site; link it by its GitHub URL"
            exit 1
          fi

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Runs on push to main only, after the build job has passed. The ref check
    # keeps a manual run from another branch from publishing it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
