name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: every tested package has a CI step
        run: python .github/scripts/ci_covers_every_package.py
      - run: python -m pip install requests pytest
      - name: apply
        run: cd apply && python -m pytest -q
      - name: check
        run: cd check && python -m pytest -q && python -m gwt_check selftest
      - name: fetch
        run: cd fetch && python -m pytest -q
      - name: ledger
        run: cd ledger && python -m unittest -v test_gwt_ledger
      - name: fscache
        run: cd fscache && python -m unittest -v test_gwt_fscache
      - name: gate
        run: cd gate && python -m unittest -v test_gwt_gate
      - name: rawstore
        run: cd rawstore && python -m unittest -v test_gwt_rawstore
      - name: queue
        run: cd queue && python -m unittest -v test_gwt_queue
      - name: leads
        run: cd leads && python -m unittest -v test_gwt_leads

  spanish-poller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: spanish-poller
        run: cd spanish-poller && node --test
