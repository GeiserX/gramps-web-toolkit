name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the mutants step diffs the pull request against its base
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install requests pytest
      - name: every package's tests
        run: python .github/scripts/run_tests.py
      - name: mutants (packages this pull request touches; all on main)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            python .github/scripts/run_tests.py --mutants
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if printf '%s\n' "$changed" | grep -q '^\.github/'; then
            python .github/scripts/run_tests.py --mutants
          else
            pkgs=$(printf '%s\n' "$changed" | { grep / || true; } | cut -d/ -f1 | sort -u | paste -sd, -)
            python .github/scripts/run_tests.py --mutants --only "${pkgs:-none}"
          fi

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"  # the oldest Python the package allows
      - name: build, install in a clean venv, run every tool from it
        run: .github/scripts/check_wheel.sh

  spanish-poller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: spanish-poller
        run: cd spanish-poller && node --test
