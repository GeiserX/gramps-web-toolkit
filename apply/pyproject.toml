[project]
name = "gwt-apply"
version = "0.1.0"
description = "Deterministic change-list applier for Gramps Web"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gwt-apply = "gwt_apply.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gwt_apply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
